name: neon_pulse
version: 1.0.0+1
publish_to: 'none'

description: 果实 - K-pop Lightstick Control App with cyberpunk neon aesthetic

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.32.0
  just_audio: ^0.10.5
  permission_handler: ^11.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  ios: true
  image_path: "ios/Runner/Assets.xcassets/AppIcon.appiconset/WechatIMG215.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
