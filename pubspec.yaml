name: neon_pulse
version: 1.0.0+1
publish_to: 'none'

description: Neon Pulse - K-pop Lightstick Control App with cyberpunk neon aesthetic

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.32.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
